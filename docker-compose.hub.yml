name: battleship-hub

# This stack is launched once. The hub creates individual rooms through the
# HTTP API instead of starting one game container per room.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: battleship
      POSTGRES_PASSWORD: battleship
      POSTGRES_DB: battleship
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleship -d battleship"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BATTLESHIP_HOST_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_USER: battleship
      DB_PASSWORD: battleship
      DB_NAME: battleship
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: "false"
      SERVER_PORT: 8000
      CORS_ALLOWED_ORIGINS: ""
      LOG_LEVEL: info
      NODE_ENV: production
      HUB_ENABLED: "true"
      # The existing hub launcher calls this HUB_URL. Compose maps that
      # deployment input to the application's canonical configuration name.
      HUB_BASE_URL: ${HUB_URL:?The hub must inject its container-reachable HUB_URL}
      # localhost:8001 works for a local hub. A deployed hub must inject the
      # browser-reachable Battleship origin instead.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub_postgres_data:
