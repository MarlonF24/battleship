name: battleship

services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${DB_PORT:?Set DB_PORT in .env}"]
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    image: ghcr.io/marlonf24/battleship:latest
    pull_policy: always
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_SSL: ${DB_SSL:?Set DB_SSL in .env}
      SERVER_PORT: ${SERVER_PORT:-8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
      NODE_ENV: production
      HUB_ENABLED: ${HUB_ENABLED:?Set HUB_ENABLED in .env}
      HUB_BASE_URL: ${HUB_BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
