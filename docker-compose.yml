name: battleship

x-battleship-image: &battleship-image
  image: ghcr.io/marlonf24/battleship:latest
  pull_policy: always

x-database-environment: &database-environment
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  DB_HOST: db
  DB_PORT: ${DB_PORT}
  DB_SSL: ${DB_SSL:?Set DB_SSL in .env}

services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${DB_PORT:?Set DB_PORT in .env}"]
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *battleship-image
    command: ["bun", "run", "db:migrate"]
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    <<: *battleship-image
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      <<: *database-environment
      SERVER_PORT: ${SERVER_PORT:-8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
      NODE_ENV: production
      HUB_BASE_URL: ${HUB_BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${SERVER_PORT:-8000}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
